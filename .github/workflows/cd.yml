name: CD Pipeline

on:
  push:
    branches: [main]
    tags:
      - 'v*'

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: staging
      url: https://staging.financeblog.com

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          NODE_ENV: staging

      - name: Deploy
        run: echo "Deploy to staging environment"
        # Add your deployment commands here
        # Example for Railway:
        # npx @railway/cli up --service staging-api

      - name: Notify
        if: always()
        run: echo "Deployment ${{ job.status }}"

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: production
      url: https://financeblog.com
    needs: [deploy-staging]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          NODE_ENV: production

      - name: Create backup
        run: echo "Creating backup..."

      - name: Deploy
        run: echo "Deploy to production environment"
        # Add your deployment commands here

      - name: Health check
        run: |
          echo "Running health checks..."
          # Add health check commands

      - name: Notify
        if: always()
        run: echo "Production deployment ${{ job.status }}"
